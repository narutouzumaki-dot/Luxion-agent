<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="LUXION AI — HyperVision personal AI workspace">
  <title>LUXION AI | HyperVision</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">L</div>
      <div><strong>LUXION</strong><small>HYPERVISION</small></div>
    </div>
    <button class="new-chat" id="newChatBtn"><i data-lucide="plus"></i> New Chat</button>
    <nav class="nav-list" aria-label="Main navigation">
      <button class="nav-item active" data-page="home"><i data-lucide="house"></i>Home</button>
      <button class="nav-item" data-page="chat"><i data-lucide="message-square"></i>AI Chat</button>
      <button class="nav-item" data-page="voice"><i data-lucide="audio-lines"></i>Voice Assistant</button>
      <button class="nav-item" data-page="tools"><i data-lucide="wrench"></i>AI Tools</button>
      <button class="nav-item" data-page="files"><i data-lucide="folder-open"></i>Files</button>
      <button class="nav-item" data-page="study"><i data-lucide="graduation-cap"></i>Study Mode</button>
      <button class="nav-item" data-page="coding"><i data-lucide="code-2"></i>Coding Lab</button>
      <button class="nav-item" data-page="studio"><i data-lucide="images"></i>AI Studio</button>
      <button class="nav-item" data-page="gallery"><i data-lucide="image"></i>Gallery</button>
      <button class="nav-item" data-page="research"><i data-lucide="globe"></i>Web Research</button>
      <button class="nav-item" data-page="history"><i data-lucide="history"></i>History</button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-page="memory"><i data-lucide="brain-circuit"></i>Memory</button>
      <button class="nav-item" data-page="settings"><i data-lucide="settings"></i>Settings</button>
      <div class="system-status"><span class="status-dot"></span><span id="connectionLabel">UI READY · API NOT CHECKED</span></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuBtn" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <div class="top-title"><h2 id="pageTitle">Home</h2><div class="online-label"><span class="status-dot"></span> HYPERVISION WORKSPACE</div></div>
      <div class="top-actions">
        <button class="icon-button" id="searchBtn" aria-label="Search"><i data-lucide="search"></i></button>
        <button class="icon-button" id="themeBtn" aria-label="Toggle contrast"><i data-lucide="sun-moon"></i></button>
      </div>
    </header>
    <section id="workspace" class="workspace" tabindex="-1"></section>
    <footer class="footer"><span>LUXION AI</span><span>POWERED BY HYPERVISION</span></footer>
  </main>
</div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
